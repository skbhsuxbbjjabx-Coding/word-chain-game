<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>끝말잇기 AI - 우리말샘 & 네이버 사전 연동</title>
  <meta name="description" content="국립국어원 우리말샘 및 네이버 국어사전 공인 표제어 100% 연동, 정방향 두음법칙 준수 미니멀 끝말잇기 배틀">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>

  <div class="app-layout">
    
    <!-- 1. 미니멀 헤더 -->
    <header class="app-header">
      <div class="brand-group">
        <span class="brand-symbol">⚡</span>
        <div class="brand-titles">
          <h1>끝말잇기 AI</h1>
          <span class="brand-subtitle">우리말샘 · 네이버 사전 연동</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="soundToggleBtn" class="header-btn" title="사운드 토글" aria-label="사운드 토글">
          <span id="soundIcon">🔊</span>
        </button>
        <button id="resetGameBtn" class="header-btn reset" title="새 게임 시작">
          <span>🔄</span>
          <span class="btn-text">새 게임</span>
        </button>
      </div>
    </header>

    <!-- 2. [제시어] 영역 -->
    <section class="target-section" id="targetSection">
      <div class="target-top-bar">
        <div id="turnBadge" class="turn-badge user">
          <span class="pulse-dot"></span>
          <span id="turnStatusText">플레이어 차례</span>
        </div>
        <div id="comboBadge" class="combo-pill">
          <span>🔥</span>
          <span id="comboText">0 COMBO</span>
        </div>
      </div>

      <div class="target-main-card">
        <div class="target-char-wrap">
          <span class="target-caption">이어받을 글자</span>
          <div id="targetCharDisplay" class="target-char">시작</div>
        </div>
        <div class="target-meta-wrap">
          <div id="dueumBadge" class="dueum-badge">원하는 단어로 시작하세요 (2자 이상)</div>
          <div id="lastWordSummary" class="last-word-summary">
            <span id="lastWordText" class="last-word-name">배틀 준비 완료</span>
            <span id="lastWordMeaning" class="last-word-desc">사전에 등재된 표준 표제어만 유효합니다.</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. [턴 로그] 영역 -->
    <main class="turn-log-section" id="turnLog" aria-live="polite">
      <div class="empty-log-state" id="emptyLogState">
        <div class="empty-icon">🎮</div>
        <h3>끝말잇기 배틀을 시작하세요!</h3>
        <p>
          국립국어원 우리말샘(약 118만 개) 및 네이버 어학사전에 정식 등재된<br>
          유효 표제어만 인정되며, <strong>한글 맞춤법 제10항·제11항 정방향 두음법칙</strong>만 적용됩니다.
        </p>
        <div class="rules-chips">
          <span class="rule-chip">✓ 비표준어/억지단어 원천 차단</span>
          <span class="rule-chip">✓ 역방향 두음법칙(니→리 등) 금지</span>
          <span class="rule-chip">✓ AI 환각(없는 단어) 생성 불가</span>
        </div>
      </div>
    </main>

    <!-- 4. [입력창] 영역 (모바일 가상 키보드 고정 레이아웃) -->
    <footer class="input-section">
      <form id="gameForm" class="input-form" autocomplete="off">
        <div id="inputPrefixBadge" class="prefix-badge" title="이어받을 글자">
          <span id="prefixChar">시작</span>
        </div>
        <input 
          type="text" 
          id="wordInput" 
          class="word-input" 
          placeholder="단어를 입력하세요 (예: 비행기)" 
          maxlength="15"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="go"
          required
        >
        <button type="submit" id="submitBtn" class="submit-btn" aria-label="단어 전송">
          <span>입력</span>
          <svg class="send-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <!-- 실시간 안내 및 반려 사유 메시지 바 -->
      <div id="inputFeedback" class="input-feedback" style="display: none;"></div>
    </footer>

  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- 스크립트 로드 -->
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
